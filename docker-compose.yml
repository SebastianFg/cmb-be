services:
    cmb-api:
        build:
            context: ./docker/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: php-85
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        volumes:
            - '.:/var/www/html'
        depends_on:
            - cmb-db
        networks:
            - cmb-network
        container_name: cmb-api
        restart: unless-stopped

    cmb-queue:
        build:
            context: ./docker/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: php-85
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            DB_QUEUE_RETRY_AFTER: '330'
        volumes:
            - '.:/var/www/html'
        depends_on:
            - cmb-db
        networks:
            - cmb-network
        container_name: cmb-queue
        command: php artisan queue:work --sleep=3 --tries=3 --timeout=300 --max-time=3600 --memory=512
        restart: unless-stopped
        stop_grace_period: 330s

    cmb-db:
        image: postgres:18.4
        environment:
            PGDATA: /var/lib/postgresql/data
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - '${DB_PORT_DOCKER}:5432'
        volumes:
            - cmb-volume:/var/lib/postgresql/data
        networks:
            - cmb-network
        container_name: cmb-db
        restart: unless-stopped

networks:
    cmb-network:
        driver: bridge

volumes:
  cmb-volume:
